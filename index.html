        /* HEADER LOGO IMAGE CSS */

.logo {
    display: flex;
    align-items: center;
}

    height: 50px;
    width: auto;

/* Mobile */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-black: #000000;
            --secondary-black: #121212;
            --primary-white: #FFFFFF;
            --secondary-white: #F5F5F5;
            --accent-gray: #888888;
            --highlight: #E0E0E0;
        }

        body {
            font-family: 'Raleway', sans-serif;
            background-color: var(--secondary-white);
            color: var(--primary-black);
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header & Navigation */
        header {
            background-color: var(--primary-white);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            animation: slideDown 1s ease-out;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); }
            to { transform: translateY(0); }
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
        }

        .logo {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 28px;
            letter-spacing: 2px;
            position: relative;
        }

        .logo span {
            color: var(--accent-gray);
        }

        .logo::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: var(--primary-black);
            border-radius: 50%;
            bottom: 5px;
            right: -12px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        .nav-links {
            display: flex;
            list-style: none;
        }

        .nav-links li {
            margin-left: 40px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--primary-black);
            font-weight: 600;
            font-size: 16px;
            position: relative;
            transition: all 0.3s ease;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            background-color: var(--primary-black);
            bottom: -5px;
            left: 0;
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-links a:hover {
            letter-spacing: 1px;
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--primary-black);
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            background: linear-gradient(to bottom, var(--primary-white) 0%, var(--secondary-white) 100%);
            position: relative;
            overflow: hidden;
        }

        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background-color: var(--highlight);
            animation: float 6s ease-in-out infinite;
        }

        .circle:nth-child(1) {
            width: 300px;
            height: 300px;
            top: 10%;
            left: 5%;
            animation-delay: 0s;
        }

        .circle:nth-child(2) {
            width: 200px;
            height: 200px;
            top: 60%;
            right: 10%;
            animation-delay: 2s;
        }

        .circle:nth-child(3) {
            width: 150px;
            height: 150px;
            bottom: 10%;
            left: 20%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 700px;
            animation: fadeInUp 1.2s ease-out 0.5s both;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 64px;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .hero p {
            font-size: 20px;
            color: var(--accent-gray);
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            padding: 15px 40px;
            background-color: var(--primary-black);
            color: var(--primary-white);
            text-decoration: none;
            font-weight: 600;
            border-radius: 30px;
            transition: all 0.4s ease;
            border: 2px solid var(--primary-black);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background-color: var(--primary-white);
            transition: left 0.4s ease;
            z-index: -1;
        }

        .btn:hover::before {
            left: 0;
        }

        .btn:hover {
            color: var(--primary-black);
            letter-spacing: 1px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        /* Services Section */
        .services {
            padding: 120px 0;
            background-color: var(--primary-white);
        }

        .section-title {
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 60px;
            position: relative;
        }

        .section-title::after {
            content: '';
            position: absolute;
            width: 80px;
            height: 4px;
            background-color: var(--primary-black);
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            animation: lineExpand 1s ease-out 1s both;
        }

        @keyframes lineExpand {
            from { width: 0; }
            to { width: 80px; }
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
        }

        .service-card {
            background-color: var(--secondary-white);
            border-radius: 10px;
            padding: 40px 30px;
            text-align: center;
            transition: all 0.4s ease;
            opacity: 0;
            transform: translateY(30px);
        }

        .service-card.animated {
            animation: cardAppear 0.8s ease-out forwards;
        }

        @keyframes cardAppear {
            to { opacity: 1; transform: translateY(0); }
        }

        .service-card:nth-child(2) { animation-delay: 0.2s; }
        .service-card:nth-child(3) { animation-delay: 0.4s; }
        .service-card:nth-child(4) { animation-delay: 0.6s; }

        .service-card:hover {
            transform: translateY(-15px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .service-icon {
            font-size: 50px;
            margin-bottom: 25px;
            color: var(--primary-black);
            transition: all 0.5s ease;
        }

        .service-card:hover .service-icon {
            transform: scale(1.2) rotate(10deg);
        }

        .service-card h3 {
            font-family: 'Montserrat', sans-serif;
            font-size: 24px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .service-card p {
            color: var(--accent-gray);
            line-height: 1.6;
        }

        /* About Section */
        .about {
            padding: 120px 0;
            background-color: var(--secondary-black);
            color: var(--primary-white);
        }

        .about-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .about-text {
            flex: 1;
            min-width: 300px;
            padding-right: 40px;
            opacity: 0;
            transform: translateX(-50px);
        }

        .about-text.animated {
            animation: slideInLeft 0.8s ease-out forwards;
        }

        @keyframes slideInLeft {
            to { opacity: 1; transform: translateX(0); }
        }

        .about-text h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 42px;
            margin-bottom: 30px;
        }

        .about-text p {
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 25px;
            color: var(--highlight);
        }

        .about-visual {
            flex: 1;
            min-width: 300px;
            position: relative;
            height: 400px;
            opacity: 0;
            transform: translateX(50px);
        }

        .about-visual.animated {
            animation: slideInRight 0.8s ease-out forwards;
        }

        @keyframes slideInRight {
            to { opacity: 1; transform: translateX(0); }
        }

        .visual-element {
            position: absolute;
            border: 2px solid var(--primary-white);
            border-radius: 10px;
            transition: all 0.5s ease;
        }

        .visual-element:nth-child(1) {
            width: 250px;
            height: 250px;
            top: 0;
            left: 0;
            animation: rotate 20s linear infinite;
        }

        .visual-element:nth-child(2) {
            width: 180px;
            height: 180px;
            bottom: 0;
            right: 0;
            animation: rotateReverse 15s linear infinite;
        }

        .visual-element:nth-child(3) {
            width: 120px;
            height: 120px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulseScale 3s ease-in-out infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes rotateReverse {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        @keyframes pulseScale {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
        }

        /* Stats Section */
        .stats {
            padding: 100px 0;
            background-color: var(--primary-white);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 40px;
            text-align: center;
        }

        .stat-item {
            opacity: 0;
            transform: translateY(30px);
        }

        .stat-item.animated {
            animation: statCount 1.5s ease-out forwards;
        }

        @keyframes statCount {
            to { opacity: 1; transform: translateY(0); }
        }

        .stat-number {
            font-family: 'Montserrat', sans-serif;
            font-size: 60px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--primary-black);
        }

        .stat-label {
            font-size: 18px;
            color: var(--accent-gray);
            font-weight: 600;
        }

        /* Footer */
        footer {
            background-color: var(--primary-black);
            color: var(--primary-white);
            padding: 80px 0 30px;
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 50px;
        }

        .footer-logo {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 32px;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .footer-logo span {
            color: var(--accent-gray);
        }

        .footer-about {
            flex: 1;
            min-width: 300px;
            margin-right: 40px;
        }

        .footer-about p {
            color: var(--highlight);
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .social-links {
            display: flex;
        }

        .social-links a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--secondary-black);
            color: var(--primary-white);
            margin-right: 15px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-links a:hover {
            background-color: var(--primary-white);
            color: var(--primary-black);
            transform: translateY(-5px);
        }

        .footer-links {
            flex: 1;
            min-width: 200px;
        }

        .footer-links h3 {
            font-family: 'Montserrat', sans-serif;
            font-size: 22px;
            margin-bottom: 25px;
        }

        .footer-links ul {
            list-style: none;
        }

        .footer-links li {
            margin-bottom: 15px;
        }

        .footer-links a {
            color: var(--highlight);
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
            padding-left: 0;
        }

        .footer-links a::before {
            content: '→';
            position: absolute;
            left: -20px;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .footer-links a:hover {
            color: var(--primary-white);
            padding-left: 20px;
        }

        .footer-links a:hover::before {
            opacity: 1;
            left: 0;
        }

        .copyright {
            text-align: center;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--accent-gray);
            font-size: 14px;
        }

        /* Responsive Design */
        @media (max-width: 992px) {
            .hero h1 {
                font-size: 50px;
            }

            .nav-links {
                display: none;
            }

            .mobile-menu-btn {
                display: block;
            }

            .mobile-menu {
                position: fixed;
                top: 80px;
                left: 0;
                width: 100%;
                background-color: var(--primary-white);
                padding: 20px;
                box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
                transform: translateY(-100%);
                opacity: 0;
                transition: all 0.5s ease;
            }

            .mobile-menu.active {
                transform: translateY(0);
                opacity: 1;
            }

            .mobile-menu ul {
                list-style: none;
            }

            .mobile-menu li {
                margin-bottom: 20px;
            }

            .mobile-menu a {
                text-decoration: none;
                color: var(--primary-black);
                font-weight: 600;
                font-size: 18px;
                display: block;
                padding: 10px 0;
                border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            }
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 40px;
            }

            .hero p {
                font-size: 18px;
            }

            .section-title {
                font-size: 36px;
            }

            .about-content {
                flex-direction: column;
            }

            .about-text {
                padding-right: 0;
                margin-bottom: 60px;
            }
        }

/* Grid */
.achievements-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    justify-items: center;
}

/* Achievement Card */
.achievement-card {
    background: linear-gradient(135deg, var(--bg), #fff);
    color: #fff;
    font-weight: bold;
    padding: 20px 15px;
    border-radius: 12px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    text-align: center;
    opacity: 0;
    transform: translateY(20px);
    animation: floatIn 0.8s forwards;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* Icon */
.achievement-card i {
    font-size: 28px;
    margin-bottom: 10px;
}

/* Floating / pop-up animation */
@keyframes floatIn {
    0% { opacity: 0; transform: translateY(20px);}
    60% { opacity: 1; transform: translateY(-5px);}
    100% { opacity: 1; transform: translateY(0);}
}

/* Sequential animation delay */
.achievement-card:nth-child(1) { animation-delay: 0.1s; }
.achievement-card:nth-child(2) { animation-delay: 0.2s; }
.achievement-card:nth-child(3) { animation-delay: 0.3s; }
.achievement-card:nth-child(4) { animation-delay: 0.4s; }
.achievement-card:nth-child(5) { animation-delay: 0.5s; }
.achievement-card:nth-child(6) { animation-delay: 0.6s; }
.achievement-card:nth-child(7) { animation-delay: 0.7s; }
.achievement-card:nth-child(8) { animation-delay: 0.8s; }

/* Hover lift + subtle bounce effect */
.achievement-card:hover {
    transform: translateY(-10px) scale(1.05);
    box-shadow: 0 12px 25px rgba(0,0,0,0.3);
}

/* Mobile Responsive */
@media (max-width: 1024px) {
    .achievements-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 600px) {
    .achievements-grid {
        grid-template-columns: 1fr;
    }
}
        body {
    font-family: 'Arial', sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 0;
}
/* Gallery Section */
.gallery {
  padding: 50px 0;
  background: #f8f9fa;
}

.section-title {
  text-align: center;
  font-size: 30px;
  font-weight: 700;
  margin-bottom: 35px;
  color: #222;
}

/* MOBILE FIRST GRID */
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr); /* Mobile: 2 images */
  gap: 12px;
}

/* Gallery Item */
.gallery-item {
  overflow: hidden;
  border-radius: 14px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.15);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

/* Image */
.gallery-item img {
  width: 100%;
  height: 160px; /* uniform look on mobile */
  object-fit: cover;
  display: block;
  transition: transform 0.4s ease;
}

/* Touch / Hover Effect */
.gallery-item:hover img,
.gallery-item:active img {
  transform: scale(1.07);
}

.gallery-item:hover {
  box-shadow: 0 12px 30px rgba(0,0,0,0.25);
}

/* TABLET */
@media (min-width: 768px) {
  .gallery-grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }

  .gallery-item img {
    height: 200px;
  }
}

/* DESKTOP */
@media (min-width: 1024px) {
  .gallery-grid {
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
  }

  .gallery-item img {
    height: 240px;
  }
}
        /* ============ HOME CLIENT LOGOS ============ */
.home-clients {
  background: #fff;
  padding: 35px 0;
}

.client-logo-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 40px;
  flex-wrap: wrap;
}

.client-logo-row img {
  max-height: 55px;
  opacity: 0.9;
  transition: transform 0.3s ease;
}

.client-logo-row img:hover {
  transform: scale(1.07);
}

/* Mobile */
@media (max-width: 600px) {
  .client-logo-row img {
    max-height: 38px;
  }
}
.hero {
  min-height: 100vh;
  padding-top: 80px;   /* fixed navbar space */
  display: flex;
  align-items: center;      /* vertical center */
  justify-content: center;  /* horizontal center */

}

.hero-content {

  margin: auto;
}

.hero-buttons {

/* ======================
   FOOTER STYLING
====================== */
footer {
    background-color: #050505;  /* Dark background */
    color: #cfcfcf;             /* Light text */
    padding: 60px 20px 30px;
    font-family: 'Poppins', sans-serif;
}

footer .container {
    max-width: 1200px;
    margin: 0 auto;
}

/* Footer Content Grid */
.footer-content {
    display: flex;
    flex-wrap: wrap;
    gap: 40px;
    justify-content: space-between;
}

/* About Section */
.footer-about {
    flex: 1 1 300px;
}

.footer-logo {
    font-size: 28px;
    font-weight: 800;
    color: #fff;
    margin-bottom: 15px;
}

.footer-logo span {
    color: #caa74d;  /* Brand gold color */
}

.footer-about p {
    font-size: 15px;
    line-height: 1.8;
    margin-bottom: 20px;
    color: #bdbdbd;
}

/* Social Links */
.social-links {
    display: flex;
    gap: 15px;
}

.social-links a {
    width: 40px;
    height: 40px;
    background-color: #111;
    color: #caa74d;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 50%;
    transition: all 0.3s ease;
    font-size: 16px;
}

.social-links a:hover {
    background-color: #caa74d;
    color: #000;
    transform: translateY(-4px);
}

/* Footer Links Sections */
.footer-links {
    flex: 1 1 200px;
}

.footer-links h3 {
    font-size: 18px;
    margin-bottom: 15px;
    color: #fff;
}

.footer-links ul {
    list-style: none;
    padding: 0;
}

.footer-links li {
    margin-bottom: 12px;
    font-size: 14px;
    line-height: 1.6;
}

.footer-links a {
    color: #cfcfcf;
    text-decoration: none;
    transition: color 0.3s ease;
}

.footer-links a:hover {
    color: #caa74d;
}

/* Copyright */
footer .copyright {
    border-top: 1px solid #1a1a1a;
    padding-top: 20px;
    text-align: center;
    font-size: 13px;
    color: #888;
    margin-top: 30px;
}

.footer-map {
    margin-top: 40px;
}

.footer-map h3 {
    color: #fff;
    margin-bottom: 15px;
    font-size: 18px;
}

.contact-float {
    position: fixed;
    right: 20px;
    bottom: 80px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    z-index: 9999;
}

.float-btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 22px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.25);
    transition: transform 0.3s ease;
}

.float-btn:hover {
    transform: scale(1.1);
}
